name: Build Mango Thermal Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build utilities
        run: |
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list dpkg >/dev/null 2>&1 || brew install dpkg
      - name: Install roothide Theos
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$GITHUB_WORKSPACE/theos"
          export THEOS="$GITHUB_WORKSPACE/theos"
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          for i in 1 2 3; do "$THEOS/bin/install-sdk" iPhoneOS16.5 && break || sleep 15; done
      - name: Patch, sign and package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          python3 patch.py layout/Library/MobileSubstrate/DynamicLibraries/MangoPanelBackgroundPlayback.dylib
          ldid -S layout/Library/MobileSubstrate/DynamicLibraries/MangoPanelBackgroundPlayback.dylib
          make package FINALPACKAGE=1
      - name: Verify package
        run: |
          pkg=$(find packages -name '*.deb' -print -quit)
          test -n "$pkg"
          dpkg-deb -f "$pkg" Package Version Architecture
          dpkg-deb -c "$pkg" | grep MangoPanelBackgroundPlayback.dylib
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MangoThermalFix
          path: packages/*.deb
      - name: Publish package and checksum
        run: |
          pkg=$(find packages -name '*.deb' -print -quit)
          sha256sum "$pkg" > packages/SHA256SUMS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages
          git commit -m "Mango thermal fix package $GITHUB_RUN_ID" || true
          git push origin main || true
